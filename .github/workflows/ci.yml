name: Django CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r DjangoNAUKOLAT/requirements.txt
      - name: Run linter
        run: |
          flake8 DjangoNAUKOLAT/ --exclude=DjangoNAUKOLAT/env/
      - name: Run tests
        run: |
          cd DjangoNAUKOLAT/RTEM
          pytest
