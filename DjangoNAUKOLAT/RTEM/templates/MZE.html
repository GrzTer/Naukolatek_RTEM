{% extends 'base.html' %}
{% load static %}

{% block title %}Energy Consumption Monitoring{% endblock %}

{% block content %}
    <h1>Energy Consumption Monitoring</h1>
    <div id="chart-area"></div>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script>
        var chartData = JSON.parse('{{ chart_data | safe }}');
        var options = {
            chart: {
                type: 'line'
            },
            series: [{
                name: 'Energy Consumption',
                data: chartData.map(item => [new Date(item.timestamp).getTime(), item.energy_consumption])
            }],
            xaxis: {
                type: 'datetime'
            }
        };

        var chart = new ApexCharts(document.querySelector("#chart-area"), options);
        chart.render();
    </script>
{% endblock %}
