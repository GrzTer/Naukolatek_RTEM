<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    {% load static %}
    <link rel="shortcut icon" type="image/png" href="{% static 'images/favicon-32x32.png' %}">
    <title>Device List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'main.css' %}">
</head>
<body>
<header class="header">
    {% include 'Navbar.html' %}
</header>
<main class="container mt-5">
    <h1><i class="fas fa-server"></i> Device List</h1>
    <table class="table table-striped">
        <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">Device ID</th>
                <th scope="col">Status</th>
                <th scope="col">Last Reading</th>
                <th scope="col">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">1</th>
                <td>SERVER-001</td>
                <td><span class="badge bg-success">Online</span></td>
                <td>2023-10-27 10:00:00</td>
                <td>
                    <a href="#" class="btn btn-primary btn-sm"><i class="fas fa-eye"></i> View</a>
                    <a href="#" class="btn btn-danger btn-sm"><i class="fas fa-trash"></i> Delete</a>
                </td>
            </tr>
            <tr>
                <th scope="row">2</th>
                <td>SERVER-002</td>
                <td><span class="badge bg-danger">Offline</span></td>
                <td>2023-10-27 09:30:00</td>
                <td>
                    <a href="#" class="btn btn-primary btn-sm"><i class="fas fa-eye"></i> View</a>
                    <a href="#" class="btn btn-danger btn-sm"><i class="fas fa-trash"></i> Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</main>
<div >
    {% include 'Footer.html' %}
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
